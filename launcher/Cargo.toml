[package]
name = "arcana-launcher"
edition.workspace = true
authors.workspace = true
readme.workspace = true
license.workspace = true
version.workspace = true
description = "Arcana Engine Launcher"

[[bin]]
name = "arcana-launcher"
path = "src/main.rs"

[dependencies]
arcana-intern = { path = "../engine/intern" }
arcana-project = { path = "../engine/project" }
arcana-error = { path = "../engine/error" }

camino = { workspace = true, features = ["serde1"] }
clap.workspace = true
denvars = { workspace = true, features = ["toml"] }
dirs.workspace = true
egui.workspace = true
egui_dnd.workspace = true
egui_file.workspace = true
egui-phosphor.workspace = true
egui_tracing.workspace = true
eframe.workspace = true
figa = { workspace = true, features = ["derive"] }
hashbrown.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-error.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Console"] }

[build-dependencies]
cc.workspace = true
image.workspace = true
