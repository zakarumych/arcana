[package]
name = "arcana-launcher"
edition.workspace = true
authors.workspace = true
readme.workspace = true
license.workspace = true
version.workspace = true
description = "Arcana Engine Launcher"

[[bin]]
name = "arcana"
path = "src/main.rs"

[dependencies]
arcana-intern = { path = "../intern" }
arcana-project = { path = "../project" }
arcana-error = { path = "../error" }

camino = { workspace = true, features = ["serde1"] }
clap.workspace = true
denvars = { workspace = true, features = ["toml"] }
dirs.workspace = true
egui.workspace = true
egui_dnd.workspace = true
egui_file.workspace = true
egui-phosphor.workspace = true
eframe.workspace = true
figa = { workspace = true, features = ["derive"] }
hashbrown.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-error.workspace = true
tracing-subscriber.workspace = true

